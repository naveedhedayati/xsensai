# Slice 5 — scheduled sync via GitHub Actions cron.
#
# Cadence: every 2 days at 07:00 UTC. Manual triggers via workflow_dispatch.
# Uses an SSH deploy key (write access) to push back to the user's vault repo.
# Reuses Slice 4's headless-runnable engine (see service.run mode="headless"
# + EnvSecretTokenProvider + DeferredExtractor).
#
# One-time setup: see docs/CRON_SETUP.md.

name: sync

on:
  schedule:
    # Every 2 days at 07:00 UTC. Spec line 178: "every 2-3 days."
    - cron: "0 7 */2 * *"
  workflow_dispatch:

# Only one scheduled run at a time. workflow_dispatch trigger queued
# behind a still-running cron is fine — `cancel-in-progress: false`
# preserves the running job. (BudgetTracker semantics are per-attempt;
# see autoplan E9.)
concurrency:
  group: xsensai-sync
  cancel-in-progress: false

# Opt into Node 24 for JS actions now. GitHub forces it 2026-06-16 and removes
# Node 20 on 2026-09-16; this silences the deprecation warning while keeping the
# SHA-pinned action versions (supply-chain defense) intact. Dependabot can bump
# the pins to the Node-24 majors later. Safe no-op once Node 24 is the default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Defense: minimum scopes. Workflow doesn't need write to this repo —
# all writes go to the vault repo via the deploy key.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Vault repo coordinates. Set as a workflow-level repo VARIABLE
      # (NOT a secret) since it's the public org/repo slug.
      # If unset, the workflow surfaces an error before doing any
      # auth-bearing work.
      VAULT_REPO: ${{ vars.VAULT_REPO }}
      # X API secrets — pinned to encrypted secrets.
      XSENSAI_X_REFRESH_TOKEN: ${{ secrets.XSENSAI_X_REFRESH_TOKEN }}
      XSENSAI_X_CLIENT_ID: ${{ secrets.XSENSAI_X_CLIENT_ID }}
      # Optional: only if your X dev app is a Confidential client
      # (the dev portal "Web App" type). Public/Native/SPA apps don't need it.
      XSENSAI_X_CLIENT_SECRET: ${{ secrets.XSENSAI_X_CLIENT_SECRET }}

    steps:
      - name: Sanity — vault repo configured
        env:
          # Bind to step env so the shell only sees a $-variable, not
          # a `${{ }}` interpolation (autoplan defense-in-depth: prevents
          # shell-injection-via-vars even though repo vars are admin-only).
          VAULT_REPO_INPUT: ${{ env.VAULT_REPO }}
        run: |
          if [ -z "$VAULT_REPO_INPUT" ]; then
            echo "::error::VAULT_REPO variable is not set."
            echo "Set it via Settings → Secrets and variables → Actions → Variables → New variable."
            echo "Format: <owner>/<repo-name> (e.g., naveedhedayati/obsidian-vault)"
            exit 2
          fi

      # Actions pinned to commit SHAs to defend against tag-substitution
      # supply-chain attacks (tj-actions style). Annotate with the
      # corresponding semver tag so Dependabot can bump cleanly.
      - name: Checkout xsensai code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Read-only — this repo provides the code, never gets written.
          persist-credentials: false

      - name: Checkout vault via deploy key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.VAULT_REPO }}
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault
          # Allow committing back via the same auth (deploy key has write).
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv==0.11.7

      - name: Install dependencies (hash-locked)
        run: uv pip install --system --require-hashes -r requirements.txt

      - name: Install xsensai package
        run: uv pip install --system -e . --no-deps

      - name: Configure git identity for the cron commit
        working-directory: vault
        run: |
          git config user.email "xsensai-cron@github-actions.local"
          git config user.name "x-sensai cron"

      - name: Preflight check (env + xdk)
        run: python -m xsensai.entrypoints.headless --check

      - name: Run headless sync (this is the load-bearing step)
        env:
          # Corpus path inside the checked-out vault. Spec layout:
          # `04_areas/x-bookmarks/`. If the vault repo doesn't follow this
          # convention, override via repo variable VAULT_CORPUS_SUBPATH.
          XSENSAI_CORPUS_PATH: vault/${{ vars.VAULT_CORPUS_SUBPATH || '04_areas/x-bookmarks' }}
          # Headless mode auto-proceeds-dirty (autoplan F8); this env is
          # documentation, not load-bearing for headless runs.
          XSENSAI_VAULT_DIRTY_PROCEED: "1"
          # Cost cap: per-attempt, default 200. Workflow-level retry must
          # be 0 (see autoplan E9).
          XSENSAI_CRON_API_CAP: "200"
        run: python -m xsensai.entrypoints.headless

      - name: Show heartbeat (forensic; no secret leakage)
        if: always()
        working-directory: vault
        env:
          # Bind to step env to avoid `${{ }}` shell interpolation.
          CORPUS_SUBPATH: ${{ vars.VAULT_CORPUS_SUBPATH || '04_areas/x-bookmarks' }}
        run: |
          if [ -f "$CORPUS_SUBPATH/_sync-status.md" ]; then
            cat "$CORPUS_SUBPATH/_sync-status.md"
          else
            echo "(no _sync-status.md yet)"
          fi
